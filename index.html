<!DOCTYPE html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="theme-color" content="#07100b">
		<meta name="format-detection" content="telephone=no">
		<title>三國群英Q戰</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	width: auto;
	height: auto;
	color: #f6e8c6;
	background-color: #07100b;
	overflow: hidden;
	touch-action: none;
	overscroll-behavior: none;
	position: fixed;
	top: env(safe-area-inset-top, 0px);
	right: env(safe-area-inset-right, 0px);
	bottom: env(safe-area-inset-bottom, 0px);
	left: env(safe-area-inset-left, 0px);
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* ---- loading screen ---- */
#status {
	position: absolute;
	inset: 0;
	background: radial-gradient(ellipse at 50% 40%, #12301f 0%, #07100b 70%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 14px;
	visibility: hidden;
	z-index: 5;
}

#status-splash {
	max-height: 38vh;
	max-width: 60vw;
	border-radius: 18px;
	box-shadow: 0 0 40px rgba(110, 255, 160, 0.35);
}

#status-splash.show-image--false {
	display: none;
}

#status-title {
	font-size: clamp(26px, 6vh, 48px);
	font-weight: 900;
	color: #e6bd55;
	letter-spacing: 0.12em;
	text-shadow: 0 2px 0 #3a2a08, 0 0 18px rgba(230, 189, 85, 0.45);
}

#status-bar {
	display: none;
	width: min(60vw, 420px);
	height: 12px;
	border: 2px solid #e6bd55;
	border-radius: 8px;
	padding: 2px;
	background: rgba(0, 0, 0, 0.5);
}

#status-fill {
	height: 100%;
	width: 0%;
	border-radius: 5px;
	background: linear-gradient(90deg, #3fa56f, #9dffb0);
	transition: width 0.2s;
}

#status-text {
	font-size: 14px;
	opacity: 0.8;
}

#status-notice {
	display: none;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
}


		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			您的瀏覽器不支援 canvas。
		</canvas>

		<noscript>
			需要啟用 JavaScript 才能遊玩。
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--false use-filter--true" src="index.png" alt="">
			<div id="status-title">三國群英Q戰</div>
			<div id="status-bar"><div id="status-fill"></div></div>
			<div id="status-text">載入中…</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":40282132,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusBar = document.getElementById('status-bar');
	const statusFill = document.getElementById('status-fill');
	const statusText = document.getElementById('status-text');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusBar.style.display = mode === 'progress' ? 'block' : 'none';
		statusText.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function displayFailureNotice(err) {
		console.error(err);
		let msg = '發生未知錯誤。';
		if (err instanceof Error) {
			msg = err.message;
		} else if (typeof err === 'string') {
			msg = err;
		}
		statusNotice.textContent = msg;
		setStatusMode('notice');
		initializing = false;
	}

	// Orientation remains under player control.
	// Block pinch / double-tap zoom and the context menu inside the game.
	document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
	document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('此瀏覽器不支援遊戲所需功能：\n' + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round(current / total * 100));
					statusFill.style.width = pct + '%';
					statusText.textContent = '載入中… ' + pct + '%';
				} else {
					statusFill.style.width = '30%';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
